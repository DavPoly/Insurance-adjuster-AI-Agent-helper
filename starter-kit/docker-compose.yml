services:
  # Vector database for storing embedded historical claims
  # You may swap this for another vector DB (Chroma, Pinecone, Weaviate, etc.)
  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    # Do not assume the upstream image includes curl. Your API should retry the
    # database readiness endpoint at startup and expose its own health check.

  # ==========================================================================
  # YOUR SERVICES BELOW
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - QDRANT_URL=http://qdrant:6333
      - TOOLS_DIR=/app/tools
    depends_on:
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data:ro

  # Lightweight Chainlit UI that talks to the api service's triage routes.
  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      api:
        condition: service_started
  # ==========================================================================

volumes:
  qdrant_data:
